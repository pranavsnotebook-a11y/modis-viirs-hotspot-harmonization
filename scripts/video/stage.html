<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FIREVERSE walkthrough stage</title>
<style>
/* A playful flat look: cream paper, ink outlines, hard shadows, big numbers. Original artwork; no third-party marks. */
:root{--paper:#EEEFE9;--ink:#151515;--orange:#F54E00;--yellow:#F9BD2B;--blue:#1D4AFF;--green:#2F9E44;--card:#FFFDF7}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
body{background-image:radial-gradient(#15151514 1.5px,transparent 1.5px);background-size:28px 28px}
.left{position:absolute;left:48px;top:44px;width:500px;bottom:44px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;font-size:30px;letter-spacing:.5px}
.brand i{width:52px;height:52px;border:4px solid var(--ink);border-radius:14px;background:var(--orange);box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center}
.quest{align-self:flex-start;font:800 22px/1 Menlo,monospace;background:var(--yellow);border:4px solid var(--ink);border-radius:999px;padding:10px 18px;box-shadow:4px 4px 0 var(--ink);text-transform:uppercase}
h1{font-size:54px;line-height:1.04;margin:0;font-weight:900;letter-spacing:-1px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.tiles{display:flex;flex-direction:column;gap:18px}
.tile{background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:7px 7px 0 var(--ink);padding:16px 20px;display:flex;align-items:center;gap:18px;transform:translateY(16px) rotate(-1deg);opacity:0;transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .25s}
.tile.in{transform:none;opacity:1}
.tile b{font-size:72px;font-weight:900;line-height:1;min-width:150px;text-align:center;letter-spacing:-2px}
.tile b.sm{font-size:44px;letter-spacing:-1px}
.tile span{font-size:25px;font-weight:700;line-height:1.15}
.tile small{display:inline-block;margin-top:8px;font:800 14px/1 Menlo,monospace;border:3px solid var(--ink);border-radius:8px;padding:4px 7px;text-transform:uppercase}
.tile[data-c=orange] b{color:var(--orange)}.tile[data-c=blue] b{color:var(--blue)}.tile[data-c=green] b{color:var(--green)}
small.obs{background:#C8F0D0}small.map{background:#DCD3FF}small.mod{background:#BFE9F5}small.scn{background:#FFD9C2}small.you{background:var(--yellow)}
.bar{margin-top:auto}.bar p{font:800 18px/1 Menlo,monospace;margin:0 0 10px;text-transform:uppercase}
.segs{display:flex;gap:8px}.segs i{flex:1;height:26px;border:4px solid var(--ink);border-radius:9px;background:var(--card);transition:background .4s}.segs i.on{background:var(--orange)}.segs i.now{background:var(--yellow)}
.win{position:absolute;left:596px;top:44px;width:1276px;height:992px;background:var(--card);border:5px solid var(--ink);border-radius:22px;box-shadow:12px 12px 0 var(--ink);overflow:hidden}
.chrome{height:52px;border-bottom:5px solid var(--ink);background:var(--yellow);display:flex;align-items:center;gap:10px;padding:0 18px;font:800 18px/1 Menlo,monospace}
.chrome u{width:18px;height:18px;border:4px solid var(--ink);border-radius:50%;background:var(--card)}.chrome u:first-child{background:var(--orange)}
.chrome span{margin-left:14px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 16px}
iframe{border:0;width:1055px;height:779px;transform:scale(1.2);transform-origin:0 0;background:#fff}
#cur{position:absolute;left:1200px;top:600px;width:34px;height:34px;z-index:9;transition:left .7s cubic-bezier(.3,.1,.2,1),top .7s cubic-bezier(.3,.1,.2,1);pointer-events:none}
#cur.tap::after{content:"";position:absolute;left:-18px;top:-18px;width:50px;height:50px;border:5px solid var(--orange);border-radius:50%;animation:tap .5s ease-out forwards}
@keyframes tap{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
</style></head><body>
<div class="left">
  <div class="brand"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff" stroke="#151515" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5c1 4-3.5 5.5-3.5 10a3.5 3.5 0 0 0 1.2 2.600C9.2 13 10.5 12 11.5 10.5c2.5 2 4 4.2 4 6.5a4.5 4.5 0 0 1-9 0"/><path d="M6.5 17a5.5 5.5 0 0 0 11 0c0-5-3.5-8-5.5-14.5"/></svg></i>FIREVERSE</div>
  <div class="quest" id="quest">Quest 1 of 9</div>
  <h1 id="head"></h1>
  <div class="tiles" id="tiles"></div>
  <div class="bar"><p id="barTxt">Walkthrough</p><div class="segs" id="segs"></div></div>
</div>
<div class="win"><div class="chrome"><u></u><u></u><u></u><span id="url">fireverse</span></div><iframe id="app" src="about:blank" allow="clipboard-write; clipboard-read"></iframe></div>
<svg id="cur" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.5L9 19z" fill="#fff" stroke="#151515" stroke-width="2.2" stroke-linejoin="round"/></svg>
<script>
const N = 9, segs = document.getElementById('segs'); for (let i = 0; i < N; i++) segs.append(document.createElement('i'));
window.scene = (n, head, url) => { document.getElementById('quest').textContent = `Quest ${n} of ${N}`; document.getElementById('head').innerHTML = head; if (url) document.getElementById('url').textContent = url;
  [...segs.children].forEach((s, i) => s.className = i < n - 1 ? 'on' : i === n - 1 ? 'now' : ''); document.getElementById('tiles').replaceChildren(); };
window.tile = (num, label, tag, tagCls, color) => { const t = document.createElement('div'); t.className = 'tile'; t.dataset.c = color || '';
  const b = document.createElement('b'); b.textContent = num; if (String(num).length > 4) b.className = 'sm'; const s = document.createElement('span'); s.textContent = label;
  if (tag) { s.append(document.createElement('br')); const m = document.createElement('small'); m.className = tagCls; m.textContent = tag; s.append(m); }
  t.append(b, s); document.getElementById('tiles').append(t); requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in'))); };
window.cur = (x, y, tap) => { const c = document.getElementById('cur'); c.style.left = x + 'px'; c.style.top = y + 'px'; if (tap) { c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap'); } };
</script></body></html>
