<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose your role · FIREVERSE</title>
<meta name="description" content="Pick a role: fire brigade, grid operator, road patrol, clinic or school lead, resident or farmer, or analyst. Each opens a page built for that job.">
<meta name="theme-color" content="#07131B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF8A3D'/%3E%3Cpath d='M16 6c1.3 4.5 6.5 7 6.5 13a6.5 6.5 0 0 1-13 0c0-2.6 1.3-4.6 2.6-5.9.4 2.2 1.6 3.5 3.1 3.9C14.3 13 14.7 9.1 16 6z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/fv.css?v=1">
<link rel="stylesheet" href="css/start.css?v=1">
</head>
<body class="st">
<a class="skip" href="#main">Skip to content</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<header class="st-top">
  <a class="st-brand" href="start.html" aria-label="FIREVERSE, choose a role"><span class="brand-mark" aria-hidden="true"></span><span class="st-brand-name">FIREVERSE</span></a>
  <button class="icon-btn theme-btn" id="themeToggle" type="button" title="Switch light or dark theme" aria-label="Switch light or dark theme" aria-pressed="false"><svg class="ico sun"><use href="#i-sun"/></svg><svg class="ico moon"><use href="#i-moon"/></svg></button>
</header>

<main class="st-main" id="main" tabindex="-1">
  <div class="st-hero">
    <h1>Who are you today?</h1>
    <p>Pick a role. Each one opens a page built for that job.</p>
  </div>

  <!-- The deck is built by js/start.js from js/roles.js. Without a data-state attribute the deck stays hidden and the noscript list below is the way in. -->
  <section class="deck" id="deck" aria-label="Roles"
           data-label-last="Last used" data-label-simplified="Simplified view" data-label-full="Full workspace"
           data-label-continue="Continue as {role}" data-label-pick="Choose a role" data-msg-shown="Six roles shown" data-msg-gathered="Cards gathered into the deck">
    <div class="stage" id="stage">
      <ol class="slots" id="slots"></ol>
      <div class="stack-hit" id="stackHit" aria-hidden="true"></div>
    </div>

    <div class="actions">
      <button class="primary-btn" id="dealBtn" type="button">Deal the roles</button>
      <a class="primary-btn" id="continueLink" href="start.html" hidden></a>
      <button class="ghost-btn" id="gatherBtn" type="button">Gather the cards</button>
    </div>

    <form class="alt" id="altForm" action="start.html">
      <label for="roleSelect">Or choose from a list</label>
      <span class="alt-row">
        <select class="select" id="roleSelect" name="role"></select>
        <button class="ghost-btn" id="openBtn" type="submit">Open</button>
      </span>
    </form>
    <p class="vh" id="live" role="status" aria-live="polite"></p>
  </section>

  <noscript>
    <div class="ns">
      <p>JavaScript is off, so the cards cannot be dealt. Choose a role from this list.</p>
      <ul class="ns-list">
        <li><a href="role.html?role=firefighter">Fire brigade</a></li>
        <li><a href="role.html?role=grid">Grid operator</a></li>
        <li><a href="role.html?role=road">Road patrol</a></li>
        <li><a href="role.html?role=care">Clinic or school lead</a></li>
        <li><a href="role.html?role=resident">Resident or farmer</a></li>
        <li><a href="index.html">Analyst</a></li>
      </ul>
    </div>
  </noscript>
</main>

<footer class="st-foot">
  <p>Satellite data, modelled wind and smoke scenarios. Not an operational alert service. <a href="downwind.html">How it works</a></p>
</footer>

<script src="js/ui.js?v=2"></script>
<script src="js/roles.js?v=1"></script>
<script src="js/start.js?v=1"></script>
</body>
</html>
